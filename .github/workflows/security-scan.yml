name: Security scan
on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install optional scanners
        run: |
          python -m pip install --quiet semgrep || true
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin || true
      - name: Run scan
        run: |
          chmod +x ./sb-security-scan.sh
          # point the two paths at wherever this repo checks out your app code;
          # by default it scans the checkout root. No LIVE_* in CI (code only).
          OUT_DIR=./sb-security-report ./sb-security-scan.sh . || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sb-security-report/findings.sarif
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: sb-security-report/
